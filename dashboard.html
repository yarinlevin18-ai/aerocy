<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Dashboard — AeroCy CRM</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07090d;
    --bg-2: #0b1117;
    --panel: #11161f;
    --panel-2: #161c27;
    --border: #1f2937;
    --border-bright: #2a3548;
    --text: #e6edf3;
    --muted: #9ba8b8;
    --muted-dim: #6b7888;
    --cyan: #00e0ff;
    --cyan-dim: #0892a5;
    --red: #ff3b4a;
    --green: #00d68f;
    --yellow: #ffb400;
    --font-heading: 'Space Grotesk', system-ui, sans-serif;
    --font-body: 'Inter', system-ui, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    line-height: 1.5;
    min-height: 100vh;
    font-size: 14px;
  }
  a { color: var(--cyan); text-decoration: none; }
  input, select, textarea, button { font-family: inherit; }

  /* ==== NAV ==== */
  nav.top {
    padding: 14px 24px;
    background: var(--bg-2);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  nav.top .wrap {
    max-width: 1600px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }
  nav.top .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text);
    font-family: var(--font-heading);
    font-weight: 700;
    font-size: 18px;
  }
  nav.top .logo svg { width: 28px; height: 28px; }
  nav.top .logo .mark { color: var(--cyan); font-style: italic; }
  nav.top .logo .crm-label {
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--muted);
    padding: 3px 8px;
    border: 1px solid var(--border-bright);
    border-radius: 3px;
    margin-left: 8px;
    font-weight: 500;
  }
  nav.top .user {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 13px;
    color: var(--muted);
  }
  nav.top .logout {
    color: var(--muted);
    font-size: 12px;
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.15s;
    background: transparent;
  }
  nav.top .logout:hover { border-color: var(--red); color: var(--red); }

  /* ==== LOGIN SCREEN ==== */
  .login-screen {
    min-height: calc(100vh - 60px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }
  .login-card {
    width: 100%;
    max-width: 420px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 40px;
    position: relative;
    overflow: hidden;
  }
  .login-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
  }
  .login-card h1 {
    font-family: var(--font-heading);
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .login-card .desc { color: var(--muted); font-size: 13px; margin-bottom: 28px; }

  /* ==== FIELDS ==== */
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    font-weight: 500;
  }
  .field input, .field select, .field textarea {
    width: 100%;
    padding: 10px 12px;
    background: var(--bg-2);
    border: 1px solid var(--border-bright);
    border-radius: 4px;
    color: var(--text);
    font-size: 14px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none;
    border-color: var(--cyan);
    box-shadow: 0 0 0 3px rgba(0,224,255,0.12);
  }

  .btn {
    padding: 11px 22px;
    font-family: var(--font-heading);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border-radius: 4px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.15s;
  }
  .btn-primary { background: var(--cyan); color: var(--bg); border-color: var(--cyan); }
  .btn-primary:hover:not(:disabled) { box-shadow: 0 0 18px rgba(0,224,255,0.35); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border-color: var(--border-bright);
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--text); }

  /* ==== ALERTS ==== */
  .alert {
    padding: 12px 14px;
    border-radius: 4px;
    margin-bottom: 16px;
    font-size: 13px;
    display: none;
  }
  .alert.show { display: block; }
  .alert.error {
    background: rgba(255,59,74,0.08);
    border: 1px solid rgba(255,59,74,0.3);
    border-left: 3px solid var(--red);
  }
  .alert.warning {
    background: rgba(255,180,0,0.08);
    border: 1px solid rgba(255,180,0,0.3);
    border-left: 3px solid var(--yellow);
  }
  .alert code {
    background: rgba(0,0,0,0.4);
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 12px;
  }

  /* ==== APP ==== */
  .app {
    max-width: 1600px;
    margin: 0 auto;
    padding: 32px 24px 80px;
    display: none;
  }
  .app.show { display: block; }

  .app-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 24px;
  }
  .app-head h1 {
    font-family: var(--font-heading);
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .app-head .right {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  /* ==== STAT BAR ==== */
  .stats {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px 18px;
    border-top: 2px solid var(--border-bright);
  }
  .stat.s-new   { border-top-color: var(--cyan); }
  .stat.s-cont  { border-top-color: var(--yellow); }
  .stat.s-qual  { border-top-color: var(--green); }
  .stat.s-clos  { border-top-color: var(--muted-dim); }
  .stat.s-all   { border-top-color: var(--text); }
  .stat .val {
    font-family: var(--font-heading);
    font-size: 28px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.02em;
    color: var(--text);
  }
  .stat .lab {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-top: 6px;
  }

  /* ==== TOOLBAR ==== */
  .toolbar {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px 18px;
    margin-bottom: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
  }
  .toolbar input[type="search"] {
    flex: 1;
    min-width: 220px;
    padding: 9px 14px;
    background: var(--bg-2);
    border: 1px solid var(--border-bright);
    border-radius: 4px;
    color: var(--text);
    font-size: 13px;
  }
  .toolbar input[type="search"]:focus {
    outline: none;
    border-color: var(--cyan);
  }
  .toolbar select {
    padding: 9px 14px;
    background: var(--bg-2);
    border: 1px solid var(--border-bright);
    border-radius: 4px;
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
  }
  .toolbar .right { margin-left: auto; display: flex; gap: 8px; }

  /* ==== TABLE ==== */
  .table-wrap {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    min-width: 1000px;
  }
  /* Explicit column widths */
  col.c-date    { width: 140px; }
  col.c-contact { width: 240px; }
  col.c-msg     { width: auto;  }
  col.c-status  { width: 140px; }
  col.c-notes   { width: 280px; }
  thead {
    background: var(--bg-2);
  }
  th {
    text-align: left;
    padding: 12px 16px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    font-weight: 600;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    background: var(--bg-2);
  }
  td {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
    font-size: 14px;
    color: var(--text);
    word-wrap: break-word;
    overflow-wrap: break-word;
  }
  tbody tr { transition: background 0.15s; }
  tbody tr:hover { background: rgba(0,224,255,0.03); }
  tbody tr.expanded { background: rgba(0,224,255,0.04); }

  td.date {
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  td.contact { min-width: 200px; }
  td.contact .name {
    font-weight: 600;
    color: var(--text);
    margin-bottom: 2px;
  }
  td.contact .meta {
    font-size: 12px;
    color: var(--muted);
  }
  td.contact .meta a { color: var(--muted); }
  td.contact .meta a:hover { color: var(--cyan); }
  td.message {
    color: var(--muted);
    font-size: 13px;
    max-width: 360px;
    line-height: 1.5;
  }
  td.message .more {
    color: var(--cyan);
    cursor: pointer;
    font-size: 12px;
    margin-left: 4px;
  }
  td.status select {
    padding: 5px 10px;
    background: var(--bg-2);
    border: 1px solid var(--border-bright);
    border-radius: 12px;
    color: var(--text);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
    cursor: pointer;
  }
  td.status select.s-new      { border-color: var(--cyan);     color: var(--cyan); }
  td.status select.s-contacted{ border-color: var(--yellow);   color: var(--yellow); }
  td.status select.s-qualified{ border-color: var(--green);    color: var(--green); }
  td.status select.s-closed   { border-color: var(--muted-dim); color: var(--muted-dim); }
  td.notes-cell textarea {
    width: 100%;
    min-height: 60px;
    padding: 8px 10px;
    background: var(--bg-2);
    border: 1px solid var(--border-bright);
    border-radius: 4px;
    color: var(--text);
    font-size: 13px;
    resize: vertical;
  }
  td.notes-cell textarea:focus {
    outline: none;
    border-color: var(--cyan);
  }
  .save-indicator {
    font-size: 10px;
    color: var(--green);
    margin-top: 4px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .save-indicator.show { opacity: 1; }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 64px 32px;
    color: var(--muted);
  }
  .empty h3 {
    font-family: var(--font-heading);
    font-size: 20px;
    color: var(--text);
    margin-bottom: 8px;
  }
  .empty p { font-size: 14px; max-width: 420px; margin: 0 auto; }

  /* Loading */
  .loading {
    text-align: center;
    padding: 64px 32px;
    color: var(--muted);
    font-size: 13px;
  }
  .loading::after {
    content: '';
    display: inline-block;
    width: 12px; height: 12px;
    border: 2px solid var(--border-bright);
    border-top-color: var(--cyan);
    border-radius: 50%;
    margin-left: 10px;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Responsive */
  @media (max-width: 900px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    td.message { max-width: 200px; }
    .toolbar { flex-direction: column; align-items: stretch; }
    .toolbar .right { margin-left: 0; }
    /* Stack table on mobile — simpler approach: horizontal scroll */
    .table-wrap { overflow-x: auto; }
  }
</style>
</head>
<body>

<nav class="top">
  <div class="wrap">
    <a href="index.html" class="logo">
      <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="30" cy="30" r="26" fill="none" stroke="#00e0ff" stroke-width="1.8"/>
        <circle cx="30" cy="30" r="18" fill="none" stroke="#0892a5" stroke-width="1"/>
        <line x1="30" y1="2" x2="30" y2="58" stroke="#0892a5" stroke-width="0.8" opacity="0.5"/>
        <line x1="2" y1="30" x2="58" y2="30" stroke="#0892a5" stroke-width="0.8" opacity="0.5"/>
        <path d="M30 18 L31 30 L42 33 L42 35 L31 33 L31 40 L33 43 L33 44 L30 43 L27 44 L27 43 L29 40 L29 33 L18 35 L18 33 L29 30 Z" fill="#e6edf3"/>
      </svg>
      <span>Aero<span class="mark">Cy</span></span>
      <span class="crm-label">CRM</span>
    </a>
    <div class="user" id="userBar" style="display:none;">
      <span id="userEmail"></span>
      <button class="logout" id="logoutBtn">Log out</button>
    </div>
  </div>
</nav>

<!-- ==== LOGIN ==== -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <h1>Sign in</h1>
    <p class="desc">AeroCy CRM dashboard — for AeroCy staff only.</p>

    <div class="alert warning" id="alertConfig">
      <strong>CRM not configured.</strong> Open <code>crm-config.js</code> and paste your Supabase URL + anon key. See <code>CRM_SETUP.md</code> for the 5-min setup.
    </div>
    <div class="alert error" id="alertLogin"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary" id="loginBtn" style="width:100%;">Sign in</button>
    </form>
  </div>
</div>

<!-- ==== APP ==== -->
<div class="app" id="app">

  <div class="app-head">
    <h1>Leads</h1>
    <div class="right">
      <button class="btn btn-ghost" id="refreshBtn">↻ Refresh</button>
      <button class="btn btn-ghost" id="exportBtn">Export CSV</button>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats" id="stats">
    <div class="stat s-all"><div class="val" id="statAll">—</div><div class="lab">Total</div></div>
    <div class="stat s-new"><div class="val" id="statNew">—</div><div class="lab">New</div></div>
    <div class="stat s-cont"><div class="val" id="statContacted">—</div><div class="lab">Contacted</div></div>
    <div class="stat s-qual"><div class="val" id="statQualified">—</div><div class="lab">Qualified</div></div>
    <div class="stat s-clos"><div class="val" id="statClosed">—</div><div class="lab">Closed</div></div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <input type="search" id="searchInput" placeholder="Search name, company, email, message…" />
    <select id="statusFilter">
      <option value="all">All statuses</option>
      <option value="new">New</option>
      <option value="contacted">Contacted</option>
      <option value="qualified">Qualified</option>
      <option value="closed">Closed</option>
    </select>
  </div>

  <!-- Table -->
  <div class="table-wrap">
    <table>
      <colgroup>
        <col class="c-date" />
        <col class="c-contact" />
        <col class="c-msg" />
        <col class="c-status" />
        <col class="c-notes" />
      </colgroup>
      <thead>
        <tr>
          <th>Received</th>
          <th>Contact</th>
          <th>Message</th>
          <th>Status</th>
          <th>Notes</th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="5"><div class="loading">Loading leads</div></td></tr>
      </tbody>
    </table>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="crm-config.js"></script>
<script>
  // ============ STATE ============
  let sb = null;
  let leads = [];
  let filtered = [];

  const $ = (id) => document.getElementById(id);
  const loginScreen = $('loginScreen');
  const app = $('app');
  const userBar = $('userBar');
  const alertConfig = $('alertConfig');
  const alertLogin = $('alertLogin');

  // ============ INIT ============
  function init() {
    if (!window.AEROCY_CRM || !window.AEROCY_CRM.ready) {
      alertConfig.classList.add('show');
      $('loginBtn').disabled = true;
      return;
    }
    sb = supabase.createClient(window.AEROCY_CRM.url, window.AEROCY_CRM.anonKey, {
      auth: { persistSession: true, autoRefreshToken: true }
    });
    checkSession();
  }

  async function checkSession() {
    const { data: { session } } = await sb.auth.getSession();
    if (session) showApp(session);
    else showLogin();
  }

  function showLogin() {
    loginScreen.style.display = 'flex';
    app.classList.remove('show');
    userBar.style.display = 'none';
  }

  function showApp(session) {
    loginScreen.style.display = 'none';
    app.classList.add('show');
    userBar.style.display = 'flex';
    $('userEmail').textContent = session.user.email;
    loadLeads();
  }

  // ============ LOGIN ============
  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    alertLogin.classList.remove('show');
    $('loginBtn').disabled = true;
    $('loginBtn').textContent = 'Signing in…';
    const email = $('email').value.trim();
    const password = $('password').value;
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      alertLogin.textContent = error.message || 'Sign-in failed';
      alertLogin.classList.add('show');
      $('loginBtn').disabled = false;
      $('loginBtn').textContent = 'Sign in';
      return;
    }
    showApp(data.session);
  });

  $('logoutBtn').addEventListener('click', async () => {
    await sb.auth.signOut();
    location.reload();
  });

  // ============ LOAD LEADS ============
  async function loadLeads() {
    const { data, error } = await sb
      .from('leads')
      .select('*')
      .order('created_at', { ascending: false });
    if (error) {
      $('tbody').innerHTML = `<tr><td colspan="5"><div class="empty"><h3>Couldn't load leads</h3><p>${escapeHtml(error.message)}</p></div></td></tr>`;
      return;
    }
    leads = data || [];
    renderStats();
    applyFilters();
  }

  $('refreshBtn').addEventListener('click', loadLeads);

  function renderStats() {
    $('statAll').textContent = leads.length;
    $('statNew').textContent       = leads.filter(l => l.status === 'new').length;
    $('statContacted').textContent = leads.filter(l => l.status === 'contacted').length;
    $('statQualified').textContent = leads.filter(l => l.status === 'qualified').length;
    $('statClosed').textContent    = leads.filter(l => l.status === 'closed').length;
  }

  // ============ FILTERS ============
  $('searchInput').addEventListener('input', applyFilters);
  $('statusFilter').addEventListener('change', applyFilters);

  function applyFilters() {
    const q = $('searchInput').value.trim().toLowerCase();
    const s = $('statusFilter').value;
    filtered = leads.filter(l => {
      if (s !== 'all' && l.status !== s) return false;
      if (!q) return true;
      const hay = [l.name, l.company, l.email, l.phone, l.message].filter(Boolean).join(' ').toLowerCase();
      return hay.includes(q);
    });
    renderTable();
  }

  // ============ RENDER ============
  function renderTable() {
    const tbody = $('tbody');
    if (!filtered.length) {
      tbody.innerHTML = `<tr><td colspan="5"><div class="empty">
        <h3>${leads.length ? 'No leads match' : 'No leads yet'}</h3>
        <p>${leads.length ? 'Try a different search or status.' : 'When someone submits the contact form, the lead will appear here.'}</p>
      </div></td></tr>`;
      return;
    }
    tbody.innerHTML = filtered.map(l => {
      const date = new Date(l.created_at).toLocaleString(undefined, {
        year: 'numeric', month: 'short', day: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
      return `
        <tr data-id="${l.id}">
          <td class="date">${date}</td>
          <td class="contact">
            <div class="name">${escapeHtml(l.name || '—')}</div>
            <div class="meta">
              ${l.company ? `<div>${escapeHtml(l.company)}</div>` : ''}
              <div><a href="mailto:${encodeURIComponent(l.email)}">${escapeHtml(l.email)}</a></div>
              ${l.phone ? `<div><a href="tel:${encodeURIComponent(l.phone)}">${escapeHtml(l.phone)}</a></div>` : ''}
            </div>
          </td>
          <td class="message">${escapeHtml(l.message || '—')}</td>
          <td class="status">
            <select class="s-${l.status}" data-field="status" data-id="${l.id}">
              <option value="new"       ${l.status==='new'?'selected':''}>New</option>
              <option value="contacted" ${l.status==='contacted'?'selected':''}>Contacted</option>
              <option value="qualified" ${l.status==='qualified'?'selected':''}>Qualified</option>
              <option value="closed"    ${l.status==='closed'?'selected':''}>Closed</option>
            </select>
          </td>
          <td class="notes-cell">
            <textarea data-field="notes" data-id="${l.id}" placeholder="Internal notes — autosaves.">${escapeHtml(l.notes || '')}</textarea>
            <div class="save-indicator" data-saved-for="${l.id}">✓ Saved</div>
          </td>
        </tr>
      `;
    }).join('');

    // Wire updates
    tbody.querySelectorAll('select[data-field="status"]').forEach(el => {
      el.addEventListener('change', () => {
        el.className = 's-' + el.value;
        updateLead(+el.dataset.id, { status: el.value });
      });
    });
    tbody.querySelectorAll('textarea[data-field="notes"]').forEach(el => {
      let timer;
      el.addEventListener('input', () => {
        clearTimeout(timer);
        timer = setTimeout(() => updateLead(+el.dataset.id, { notes: el.value }), 600);
      });
    });
  }

  // ============ UPDATE ============
  async function updateLead(id, patch) {
    const { error } = await sb.from('leads').update(patch).eq('id', id);
    if (error) {
      console.error(error);
      alert('Update failed: ' + error.message);
      return;
    }
    // Update local cache
    const i = leads.findIndex(l => l.id === id);
    if (i !== -1) leads[i] = { ...leads[i], ...patch };
    renderStats();
    const indicator = document.querySelector(`[data-saved-for="${id}"]`);
    if (indicator) {
      indicator.classList.add('show');
      setTimeout(() => indicator.classList.remove('show'), 1500);
    }
  }

  // ============ CSV EXPORT ============
  $('exportBtn').addEventListener('click', () => {
    if (!filtered.length) {
      alert('Nothing to export.');
      return;
    }
    const headers = ['Received', 'Name', 'Company', 'Email', 'Phone', 'Message', 'Status', 'Notes'];
    const rows = filtered.map(l => [
      new Date(l.created_at).toISOString(),
      l.name || '', l.company || '', l.email || '',
      l.phone || '', l.message || '', l.status || '', l.notes || ''
    ]);
    const csv = [headers, ...rows].map(r =>
      r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')
    ).join('\r\n');
    const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `aerocy-leads-${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  });

  // ============ UTIL ============
  function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, m => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    })[m]);
  }

  init();
</script>

</body>
</html>
